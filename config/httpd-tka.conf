# ============================================================
# Virtual host untuk Tryout TKA v2
# Tambahkan blok di bawah ke:
#   C:\xampp\apache\conf\extra\httpd-vhosts.conf
# Lalu restart Apache.
#
# Akses: http://192.168.1.10/tka/  (sesuaikan IP server)
# ============================================================

Alias /tka "D:/Tryout TKA v2/web"

<Directory "D:/Tryout TKA v2/web">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require ip 127.0.0.1 ::1 192.168.101.0/24 192.168.1.0/24
    DirectoryIndex login.php index.php
</Directory>

# Blokir akses langsung ke folder api/.htaccess (sudah otomatis)
# Blokir akses ke file di luar web/ lewat URL
<Directory "D:/Tryout TKA v2">
    Require all denied
</Directory>
<Directory "D:/Tryout TKA v2/web">
    Require ip 127.0.0.1 ::1 192.168.101.0/24 192.168.1.0/24
</Directory>